    <!-- Prerender flash guard. The prerendered HTML is the mobile layout; on
         desktop the client mounts a fullscreen black intro video. Without this,
         the browser would paint the baked mobile content for a frame before the
         intro covers it. We hide #root on desktop (>=769px) until the app marks
         itself ready (adds .js-ready after React commits) — so the first paint is
         the same black as the intro, never the baked content. Crawlers read the
         DOM regardless of visibility, so SEO is unaffected. Mobile has no intro,
         so the guard never applies there. -->
    <style>
      @media (min-width: 769px) {
        html:not(.js-ready) { background: #000; }
        html:not(.js-ready) #root { visibility: hidden; }
      }
    </style>
    <noscript><style>#root { visibility: visible !important; }</style></noscript>
